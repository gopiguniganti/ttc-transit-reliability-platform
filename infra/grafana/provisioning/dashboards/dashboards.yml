# Tells Grafana to load any dashboard JSON dropped in this folder on
# startup, instead of dashboards only existing if someone builds them by
# hand in the UI and Grafana's own (non-versioned) internal database.
apiVersion: 1

providers:
  - name: ttc-platform
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
