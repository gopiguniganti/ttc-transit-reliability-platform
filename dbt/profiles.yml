ttc_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'ttc') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'ttc_dev_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'serving') }}"
      schema: staging
      threads: 4
