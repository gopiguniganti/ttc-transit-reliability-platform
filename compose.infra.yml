# Compute + streaming stack for local dev on Beast. No restart policy --
# unlike the poller, nothing here needs to survive a reboot.
#
#   docker compose -f compose.infra.yml up -d
#   docker compose -f compose.infra.yml ps
#   docker compose -f compose.infra.yml down       # add -v to also drop volumes

services:

  # KRaft mode (no ZooKeeper): one container as both controller and broker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: ttc-kafka
    ports:
      - "9092:9092"     # external listener, for clients outside Docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092"
      # EXTERNAL must be a LAN-reachable address, not localhost -- Kafka
      # redirects clients to the advertised address after the initial
      # connect, so "localhost" only works for clients on this machine.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://192.168.2.40:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # This image's entrypoint reads the unprefixed CLUSTER_ID, not
      # KAFKA_CLUSTER_ID -- get the name wrong and it reformats storage
      # on every restart.
      CLUSTER_ID: "Gtc5medBQ5-bHQGeAb5ZxQ"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Default log.dirs is /tmp/kraft-combined-logs, not the mounted
      # volume -- must be set explicitly or data doesn't survive a recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ttc-net

  kafka-ui:
    image: tchiotludo/akhq:0.25.1
    container_name: ttc-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local:
              properties:
                bootstrap.servers: "kafka:29092"
    networks:
      - ttc-net

  # S3-compatible object storage. Spark/Delta talk to it over S3A, the
  # same protocol they'd use against real AWS S3.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: ttc-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ttc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the buckets on startup, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: ttc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/bronze &&
      mc mb -p local/silver &&
      mc mb -p local/gold &&
      mc mb -p local/raw-archive &&
      echo 'buckets ready'
      "
    networks:
      - ttc-net

  # One instance, separate databases per concern (serving / metastore /
  # airflow) -- see infra/postgres-init.
  postgres:
    image: postgres:16
    container_name: ttc-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc_dev_password
      POSTGRES_DB: serving
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ttc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: ttc-pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ttcplatform.dev   # pgAdmin rejects .local as a TLD
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"   # single-user mode, no separate login flow
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ttc-net

  # Official Apache Spark image. One master, two workers.
  spark-master:
    image: apache/spark:3.5.3
    container_name: ttc-spark-master
    user: root   # needed to write to the mounted volume; fine for local dev
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"   # cluster protocol
      - "8080:8080"   # master UI -- cluster/worker health only, no jobs/DAGs
      - "4041:4040"   # driver UI for jobs run via spark-submit here, live only
    volumes:
      - ./notebooks:/opt/spark-apps
      - spark_ivy:/opt/spark/.ivy2
      - spark_events:/tmp/spark-events   # persisted job history, see spark-history
    networks:
      - ttc-net

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: ttc-spark-worker-1
    user: root
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 6g
    volumes:
      - ./notebooks:/opt/spark-apps
      - spark_ivy:/opt/spark/.ivy2
    networks:
      - ttc-net

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: ttc-spark-worker-2
    user: root
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 6g
    volumes:
      - ./notebooks:/opt/spark-apps
      - spark_ivy:/opt/spark/.ivy2
    networks:
      - ttc-net

  # Reads persisted event logs and reconstructs Jobs/Stages/DAG for jobs
  # that have already finished -- what the live driver UI can't show you
  # after the session ends.
  spark-history:
    image: apache/spark:3.5.3
    container_name: ttc-spark-history
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/tmp/spark-events"
    ports:
      - "18080:18080"
    volumes:
      - spark_events:/tmp/spark-events
    networks:
      - ttc-net

  # Long-running consumer: Kafka topic -> Delta table on MinIO. Unlike the
  # notebook/checkpoint jobs this must stay alive, so it gets its own
  # restart policy instead of being a one-shot spark-submit.
  spark-streaming:
    image: apache/spark:3.5.3
    container_name: ttc-spark-streaming
    user: root
    restart: unless-stopped
    depends_on:
      - spark-master
      - kafka
      - minio
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.cores.max=4
      --packages org.apache.hadoop:hadoop-aws:3.3.4,io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      /opt/spark-apps/01_stream_to_delta.py
    ports:
      - "4042:4040"   # this job's own driver UI, live while the query runs
    volumes:
      - ./notebooks:/opt/spark-apps
      - spark_ivy:/opt/spark/.ivy2
      - spark_events:/tmp/spark-events
    networks:
      - ttc-net

  # Interactive PySpark / Spark SQL / Postgres / MinIO environment,
  # against the real cluster instead of just spark-submit scripts.
  jupyter:
    build:
      context: ./notebooks
      dockerfile: Dockerfile.jupyter
    container_name: ttc-jupyter
    depends_on:
      - spark-master
      - postgres
      - minio
    ports:
      - "8888:8888"   # JupyterLab -- open this in a browser
      - "4040:4040"   # Spark application (driver) UI for the notebook's SparkSession -- live only
    volumes:
      - ./notebooks:/home/jovyan/work
      - spark_ivy:/home/jovyan/.ivy2   # share the Maven/Ivy jar cache with spark-master
      - spark_events:/tmp/spark-events # notebook's SparkSession writes event logs here -- see spark-history
    networks:
      - ttc-net

  # On-demand job, not part of `up -d` -- run with `make gtfs-load`. Loads
  # routes/stops/trips from TTC's public GTFS static feed into Postgres.
  gtfs-loader:
    build: ./gtfs_static
    container_name: ttc-gtfs-loader
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: serving
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc_dev_password
    depends_on:
      - postgres
    networks:
      - ttc-net

  # On-demand jobs, not part of `up -d` -- run with `make weather-load` /
  # `make restrictions-load`. Same image, different entrypoint script.
  weather-loader:
    build: ./context_data
    container_name: ttc-weather-loader
    profiles: ["tools"]
    command: ["python3", "load_weather.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: serving
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc_dev_password
    depends_on:
      - postgres
    networks:
      - ttc-net

  road-restrictions-loader:
    build: ./context_data
    container_name: ttc-road-restrictions-loader
    profiles: ["tools"]
    command: ["python3", "load_road_restrictions.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: serving
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc_dev_password
    depends_on:
      - postgres
    networks:
      - ttc-net

networks:
  ttc-net:
    name: ttc-net

volumes:
  kafka_data:
  minio_data:
  postgres_data:
  pgadmin_data:
  spark_ivy:
  spark_events:
